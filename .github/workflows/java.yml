name: Java build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile application
        run: |
          mkdir -p build test-build
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d build src/neonbreaker/*.java
      - name: Run tests
        run: |
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -cp build -d test-build tests/neonbreaker/*.java
          java -Djava.awt.headless=true -cp build:test-build neonbreaker.GameEngineTest
      - name: Package application
        run: jar --create --file NeonBreaker.jar --main-class neonbreaker.Main -C build neonbreaker
      - uses: actions/upload-artifact@v7
        with:
          name: NeonBreaker-java-${{ matrix.java }}
          path: NeonBreaker.jar
          if-no-files-found: error
